<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online School</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
    }

    nav {
      background-color: #007BFF;
      padding: 10px 0;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      margin-top: 30px;
      color: #333;
    }

    .course-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 50px auto;
      max-width: 1000px;
      padding: 0 10px;
    }

    .course {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 250px;
      transition: transform 0.2s;
    }

    .course:hover {
      transform: translateY(-5px);
    }

    .course h2 {
      color: #007BFF;
    }

    .learn-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .learn-btn:hover {
      background-color: #0056b3;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background-color: #333;
      color: white;
    }
  </style>
</head>
<body>

  <nav>
    <a href="Home.html">Home</a>
    <a href="aboutus.html">About</a>
    <a href="Contact Us.html">Contact</a>
  </nav>

  <h1>Welcome to Our Online School</h1>

  <div class="course-container">
    <div class="course">
      <h2>Video Editing</h2>
      <a href="videos.html" class="learn-btn">Learn</a>
    </div>
    <div class="course">
      <h2>Graphic Design</h2>
      <a href="https://www.canva.com/learn/graphic-design/" target="_blank" class="learn-btn">Learn</a>
    </div>
    <div class="course">
      <h2>Coding</h2>
      <a href="https://www.freecodecamp.org/" target="_blank" class="learn-btn">Learn</a>
    </div>
  </div>

  <footer>
    &copy; 2025 Online School. All rights reserved.
  </footer>

</body>
</html>
